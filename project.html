<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Durva Sharma</title>
<meta name="description" content="Notes on the projects Durva Sharma has built: what each one does, how it works, the numbers, and what didn't hold up.">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Archivo:wdth,wght@62..125,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4eee1;--paper:#faf6ec;--ink:#1e1b17;--soft:#6a6358;--rule:#d8cdb8;--red:#c4122c;--tan:#b9ab8f;--serif:"Newsreader",Georgia,serif;--sans:"Archivo",Arial,sans-serif;--mono:"DM Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--ink)}
body{overflow-x:clip;font:400 1.18rem/1.62 var(--serif);font-optical-sizing:auto;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
.col{max-width:41rem;margin:0 auto;padding:0 1.25rem}
.wide{max-width:60rem;margin:0 auto}

.nav{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.4rem 1.25rem;font:500 .84rem var(--sans);max-width:60rem;margin:0 auto}
.nav a{text-decoration:none}
.tabs{display:flex;gap:.2rem;flex-wrap:wrap}
.tabs a{padding:.2rem .65rem;border-radius:99px}
.tabs a.on{background:var(--ink);color:var(--bg)}
.tabs a:not(.on):hover{background:rgba(30,27,23,.07);color:var(--ink)}
header.top{padding:5rem 1.25rem 2rem}
header.top h1{font:600 clamp(2.6rem,7vw,4.4rem)/1 var(--serif);letter-spacing:-.025em}
.meta{margin-top:1rem;font:400 .78rem/1.8 var(--mono);color:var(--soft);display:flex;gap:.4rem 1rem;flex-wrap:wrap}
.meta a{color:var(--ink)}
.abs{margin-top:1.6rem;font-size:1.3rem;line-height:1.5}
.abs b{font-weight:600}
.stat{display:flex;gap:1.6rem 2.4rem;flex-wrap:wrap;margin:2rem 0 0}
.stat div b{display:block;font:600 2rem/1 var(--serif);letter-spacing:-.02em;color:var(--red)}
.stat div span{display:block;margin-top:.3rem;font:500 .78rem/1.3 var(--sans);color:var(--soft);max-width:11rem}

#page{counter-reset:fig sec}
section.s{margin-top:4rem;padding:0 1.25rem;counter-increment:sec}
h2{font:700 .8rem var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--red);margin-bottom:.9rem}
h2::before{content:counter(sec) "  ";color:var(--soft);margin-right:.4rem}
section p+p{margin-top:1em}
.note{font-size:.9rem;color:var(--soft);line-height:1.5}
ul.l{padding-left:1.1rem;margin-top:.8rem;display:grid;gap:.5rem}
ul.l li::marker{color:var(--red)}
code{font:400 .84em var(--mono);background:rgba(30,27,23,.07);padding:.08em .35em;border-radius:3px}
pre.code{margin-top:1.1rem;background:var(--ink);color:#f1e9d6;padding:1.1rem 1.2rem;border-radius:4px;font:400 .8rem/1.65 var(--mono);overflow:auto}
table.t{width:100%;border-collapse:collapse;margin-top:1.1rem;font-size:.95rem}
table.t th{font:700 .72rem var(--sans);letter-spacing:.07em;text-transform:uppercase;text-align:left;color:var(--soft);padding:.4rem .8rem .5rem 0;border-bottom:1.5px solid var(--ink)}
table.t td{padding:.55rem .8rem .55rem 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.t td:first-child{font:400 .82rem var(--mono);white-space:nowrap}
.tw{overflow-x:auto}

figure.fig{margin:2.2rem 0 0 50%;width:min(60rem,calc(100vw - 2.5rem));transform:translateX(-50%);counter-increment:fig}
.fig .box{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:1.2rem 1.2rem 1rem}
.fig figcaption{margin-top:.6rem;font-size:.92rem;line-height:1.5;color:var(--soft)}
.fig figcaption b{font:700 .72rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-right:.5rem}
.fig figcaption b::before{content:"Fig. " counter(fig)}
.fig img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:4px;background:#fff}
.ctl{display:flex;gap:.6rem 1rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;font:500 .82rem var(--sans)}
.btn{border:1.5px solid var(--ink);background:none;border-radius:99px;padding:.32rem .95rem;font:600 .82rem var(--sans);transition:background .15s,color .15s,transform .1s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:active{transform:translateY(1px)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--ink);border-color:var(--ink)}
label.chk{display:inline-flex;gap:.45rem;align-items:center;cursor:pointer;user-select:none}
input[type=checkbox]{accent-color:var(--red);width:1rem;height:1rem}
input[type=range]{accent-color:var(--red);flex:1 1 12rem;min-width:8rem}
input[type=text],select{font:400 .95rem var(--serif);border:1.5px solid var(--ink);background:var(--bg);border-radius:4px;padding:.4rem .6rem;color:var(--ink)}
input[type=text]{flex:1 1 14rem;min-width:10rem}
.out{font:400 .84rem/1.7 var(--mono)}
svg text{font-family:var(--sans)}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{stroke:var(--ink);stroke-width:1}
.chart .gr{stroke:var(--rule);stroke-width:1}
.chart .tk{font-size:11px;fill:var(--soft)}
.chart .lb{font-size:11.5px;font-weight:700;fill:var(--ink)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:500 .75rem/1.4 var(--sans);padding:.3rem .55rem;border-radius:3px;white-space:nowrap;transform:translate(-50%,-125%);opacity:0;transition:opacity .12s;z-index:3}
.rel{position:relative}
.cells{display:flex;gap:.35rem;flex-wrap:wrap;margin:.35rem 0 .9rem}
.cell{padding:.4rem .75rem;border-radius:4px;font:600 .82rem var(--sans);border:1.5px solid var(--ink);transition:background .25s,color .25s,border-color .25s}
.cell.hit{background:#e9dfc7;border-color:#e9dfc7;color:var(--ink)}
.cell.miss{background:var(--red);border-color:var(--red);color:#fff}
.cell.un{border-style:dashed;border-color:var(--red);color:var(--red)}
.rowl{font:700 .72rem var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.flow{display:flex;flex-wrap:wrap;gap:.5rem .35rem;align-items:center}
.flow .st{display:inline-flex;flex-direction:column;gap:.35rem}
.flow .n{border:1.5px solid var(--ink);border-radius:4px;padding:.4rem .7rem;font:600 .8rem/1.25 var(--sans);background:var(--bg)}
.flow .n small{display:block;font-weight:400;color:var(--soft);font-size:.72rem}
.flow .n.hl{background:var(--red);border-color:var(--red);color:#fff}
.flow .n.hl small{color:#ffd9de}
.flow .a{color:var(--soft);font:400 .9rem var(--mono)}
.hubf{display:flex;flex-wrap:wrap;gap:.5rem}
.hubf button{border:1.5px solid var(--ink);background:var(--bg);border-radius:4px;padding:.5rem .8rem;font:600 .85rem var(--sans);text-align:left;transition:all .15s}
.hubf button:hover,.hubf button.on{background:var(--ink);color:var(--bg)}
nav.pn{display:flex;justify-content:space-between;gap:1rem;margin:5rem auto 0;padding:1.4rem 1.25rem 5rem;border-top:1px solid var(--rule);font:500 .9rem var(--sans)}
canvas.cv{display:block;width:100%;max-width:26rem;height:auto;border:1px solid var(--rule);border-radius:4px;image-rendering:pixelated;background:#222}
@media (max-width:700px){body{font-size:1.1rem}header.top{padding-top:3.5rem}.nav{padding:1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<nav class="nav"><a href="/">← Durva Sharma</a><div class="tabs" id="tabs"></div></nav>
<main id="page"></main>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const rnd = seed => () => (seed = seed * 16807 % 2147483647) / 2147483647;
const GH = 'https://github.com/sykeriin/', RAW = 'https://raw.githubusercontent.com/sykeriin/tread/HEAD/docs/img/';

/* ================= charts ================= */
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (w, h) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.setAttribute('class', 'chart'); s.setAttribute('role', 'img'); return s; };
const add = (p, n, a = {}, t) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (t != null) e.textContent = t; p.appendChild(e); return e; };
const nice = (max, n = 4) => { const raw = max / n, mag = 10 ** Math.floor(Math.log10(raw)), f = raw / mag, step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag; return { step, top: Math.ceil(max / step - 1e-9) * step }; };

function lineChart(host, o) {
  const W = 640, H = 330, m = { l: 54, r: 100, t: 14, b: 48 }, iw = W - m.l - m.r, ih = H - m.t - m.b, svg = svgEl(W, H);
  svg.setAttribute('aria-label', o.alt || o.yl);
  const xs = o.series.flatMap(s => s.pts.map(p => p[0])), ys = o.series.flatMap(s => s.pts.map(p => p[1]));
  const x0 = o.xmin ?? Math.min(...xs), x1 = o.xmax ?? Math.max(...xs), { step, top } = nice(o.ymax ?? Math.max(...ys), 4);
  const X = v => m.l + (v - x0) / (x1 - x0) * iw, Y = v => m.t + ih - v / top * ih;
  for (let v = 0; v <= top + 1e-9; v += step) { add(svg, 'line', { class: 'gr', x1: m.l, x2: m.l + iw, y1: Y(v), y2: Y(v) }); add(svg, 'text', { class: 'tk', x: m.l - 8, y: Y(v) + 4, 'text-anchor': 'end' }, +v.toFixed(3)); }
  (o.xticks || [x0, x1]).forEach(v => { add(svg, 'line', { class: 'ax', x1: X(v), x2: X(v), y1: m.t + ih, y2: m.t + ih + 4 }); add(svg, 'text', { class: 'tk', x: X(v), y: m.t + ih + 18, 'text-anchor': 'middle' }, o.xfmt ? o.xfmt(v) : v); });
  add(svg, 'line', { class: 'ax', x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih });
  add(svg, 'line', { class: 'ax', x1: m.l, x2: m.l, y1: m.t, y2: m.t + ih });
  add(svg, 'text', { class: 'tk', x: m.l + iw / 2, y: H - 6, 'text-anchor': 'middle' }, o.xl);
  add(svg, 'text', { class: 'tk', transform: `translate(14 ${m.t + ih / 2}) rotate(-90)`, 'text-anchor': 'middle' }, o.yl);
  if (o.ref != null) { add(svg, 'line', { x1: m.l, x2: m.l + iw, y1: Y(o.ref), y2: Y(o.ref), stroke: '#6a6358', 'stroke-dasharray': '3 4' }); add(svg, 'text', { class: 'tk', x: m.l + iw + 6, y: Y(o.ref) + 4 }, o.refLabel || ''); }
  const dots = [];
  o.series.forEach(s => {
    add(svg, 'polyline', { points: s.pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' '), fill: 'none', stroke: s.color, 'stroke-width': 2.4, 'stroke-linejoin': 'round' });
    s.pts.forEach((p, i) => { const c = add(svg, 'circle', { cx: X(p[0]), cy: Y(p[1]), r: o.dot || 4.2, fill: (s.open || []).includes(i) ? 'var(--paper)' : s.color, stroke: s.color, 'stroke-width': 2 }); dots.push({ c, s, p }); });
    if (s.name) { const e = s.pts[s.pts.length - 1]; add(svg, 'text', { class: 'lb', x: X(e[0]) + 9, y: Y(e[1]) + 4, fill: s.color }, s.name); }
  });
  host.classList.add('rel'); host.appendChild(svg);
  const tip = document.createElement('div'); tip.className = 'tip'; host.appendChild(tip);
  dots.forEach(d => { d.c.style.cursor = 'pointer'; const show = () => { const r = d.c.getBoundingClientRect(), hr = host.getBoundingClientRect(); tip.style.left = r.left - hr.left + r.width / 2 + 'px'; tip.style.top = r.top - hr.top + 'px'; tip.textContent = (d.s.name ? d.s.name + ': ' : '') + (o.tipfmt ? o.tipfmt(d.p) : d.p.join(', ')); tip.style.opacity = 1; };
    d.c.addEventListener('pointerenter', show); d.c.addEventListener('pointerleave', () => tip.style.opacity = 0); d.c.addEventListener('click', show); });
  return { svg, X, Y, add: (n, a, t) => add(svg, n, a, t) };
}

function barChart(host, o) {
  const rowH = 38, W = 640, m = { l: o.lw || 190, r: 80, t: 6, b: 34 }, H = m.t + m.b + rowH * o.rows.length, iw = W - m.l - m.r, svg = svgEl(W, H), { step, top } = nice(o.max, 4);
  svg.setAttribute('aria-label', o.alt || o.xl); const X = v => m.l + v / top * iw;
  for (let v = 0; v <= top + 1e-9; v += step) { add(svg, 'line', { class: 'gr', x1: X(v), x2: X(v), y1: m.t, y2: H - m.b }); add(svg, 'text', { class: 'tk', x: X(v), y: H - m.b + 15, 'text-anchor': 'middle' }, o.xfmt ? o.xfmt(v) : +v.toFixed(3)); }
  add(svg, 'text', { class: 'tk', x: m.l + iw / 2, y: H - 3, 'text-anchor': 'middle' }, o.xl);
  o.rows.forEach((r, i) => { const y = m.t + i * rowH + 7, hl = r[3];
    add(svg, 'text', { class: 'lb', x: m.l - 10, y: y + 15, 'text-anchor': 'end', style: 'font-weight:500' }, r[0]);
    const w = X(r[1]) - m.l, b = add(svg, 'rect', { x: m.l, y, height: 22, width: o.instant ? Math.max(2, w) : 0, fill: hl === 1 ? 'var(--red)' : hl === 2 ? 'var(--tan)' : 'var(--ink)', rx: 2 }); b.dataset.w = Math.max(2, w); if (!o.instant) b.style.transition = 'width .9s cubic-bezier(.2,.7,.2,1)';
    add(svg, 'text', { class: 'lb', x: X(r[1]) + 8, y: y + 15 }, r[2]); });
  add(svg, 'line', { class: 'ax', x1: m.l, x2: m.l, y1: m.t, y2: H - m.b });
  host.appendChild(svg);
  if (!o.instant) new IntersectionObserver((es, ob) => { if (es[0].isIntersecting) { $$('rect[data-w]', svg).forEach(b => b.setAttribute('width', b.dataset.w)); ob.disconnect(); } }, { threshold: .3 }).observe(host);
}

/* ================= the figures: each builder fills its box ================= */
const B = {};

B.shuffle = box => {
  const SYS = 500, DOC = 2000; let last = null, order = ['A', 'B', 'C'];
  box.innerHTML = `<div class="ctl"><button class="btn red" data-a="sh">Shuffle the documents</button><button class="btn" data-a="rs">Reset</button><span class="out" data-r="st"></span></div>
    <div class="rowl">Prefix cache (vLLM-style)</div><div class="cells" data-r="r1"></div><div class="rowl">tread</div><div class="cells" data-r="r2"></div><div class="out" data-r="sum"></div>`;
  const q = k => $(`[data-r=${k}]`, box), cell = (t, k) => `<span class="cell ${k}">${t}</span>`;
  const draw = () => {
    const now = ['sys', ...order]; let pre, tr;
    if (!last) { pre = now.map(() => 'miss'); tr = pre.slice(); } else { const prev = ['sys', ...last]; let ok = true; pre = now.map((d, i) => { if (ok && prev[i] === d) return 'hit'; ok = false; return 'miss'; }); tr = now.map(() => 'hit'); }
    const lab = ['system', ...order.map(d => 'doc ' + d)], tok = now.map((d, i) => i ? DOC : SYS), read = a => a.reduce((s, k, i) => s + (k === 'miss' ? tok[i] : 0), 0), a = read(pre), b = read(tr);
    q('r1').innerHTML = lab.map((l, i) => cell(l, pre[i])).join(''); q('r2').innerHTML = lab.map((l, i) => cell(l, tr[i])).join('');
    q('st').textContent = last ? `order now: ${order.join(' ')}` : 'first request: nothing is cached yet';
    q('sum').innerHTML = last ? `Tokens read from scratch: prefix cache <b style="color:var(--red)">${a.toLocaleString()}</b>, tread <b>${b.toLocaleString()}</b> (of ${(SYS + 3 * DOC).toLocaleString()}).` : `Tokens read: ${a.toLocaleString()} for both. Press shuffle for a second request.`; };
  const perms = [['A', 'B', 'C'], ['A', 'C', 'B'], ['B', 'A', 'C'], ['B', 'C', 'A'], ['C', 'A', 'B'], ['C', 'B', 'A']];
  $('[data-a=sh]', box).onclick = () => { last = order.slice(); let n; do { n = perms[Math.floor(Math.random() * 6)]; } while (n.join() === order.join()); order = n; draw(); };
  $('[data-a=rs]', box).onclick = () => { last = null; order = ['A', 'B', 'C']; draw(); }; draw();
};

B.speed = box => lineChart(box, { xl: 'context length (tokens)', yl: 'speed-up over a full read (×)', xticks: [1000, 2000, 4000, 8000], xfmt: v => v / 1000 + 'k', ymax: 6, ref: 1, refLabel: 'full read', xmin: 1000, xmax: 8000, alt: 'Speed-up over a full read against context length',
  series: [{ name: 'plain reuse', color: '#c4122c', pts: [[1000, 1], [2000, 1.9], [4000, 3.1], [8000, 5.8]], open: [0] }, { name: '20% recompute', color: '#1e1b17', pts: [[4000, 1.4], [8000, 1.6]] }], tipfmt: p => `${p[1]}× at ${p[0] / 1000}k tokens` });

B.kl = box => {
  const pts = [[0, .263], [20, .099], [30, .07], [50, .029], [100, 0]], f = x => { for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) { const [a, b] = [pts[i - 1], pts[i]]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]); } return 0; };
  box.innerHTML = `<div class="ctl"><label for="rc">Tokens recomputed</label><input id="rc" type="range" min="0" max="100" value="20"><span class="out" data-r="ro"></span></div><div data-r="ch"></div>`;
  const c = lineChart($('[data-r=ch]', box), { xl: 'share of document tokens recomputed (%)', yl: 'KL divergence from a full read', xticks: [0, 20, 40, 60, 80, 100], xfmt: v => v + '%', ymax: .3, alt: 'KL divergence against recompute share',
    series: [{ name: 'measured', color: '#1e1b17', pts }], tipfmt: p => `${p[0]}% recomputed, KL ${p[1]}` });
  const ln = c.add('line', { stroke: 'var(--red)', 'stroke-dasharray': '3 3' }), dot = c.add('circle', { r: 7, fill: 'var(--red)', stroke: '#fff', 'stroke-width': 2, 'pointer-events': 'none' });
  const set = () => { const v = +$('#rc', box).value, y = f(v); dot.setAttribute('cx', c.X(v)); dot.setAttribute('cy', c.Y(y)); ln.setAttribute('x1', c.X(v)); ln.setAttribute('x2', c.X(v)); ln.setAttribute('y1', c.Y(y)); ln.setAttribute('y2', c.Y(0));
    $('[data-r=ro]', box).textContent = `${v}% → KL ${y.toFixed(3)} (${pts.some(p => p[0] === v) ? 'measured' : 'read off the line'}), ${(100 * (1 - y / .263)).toFixed(0)}% of the drift removed`; };
  $('#rc', box).oninput = set; set();
};

B.fuzz = box => {
  const TR = [{ id: 'date', test: s => s.day === 1, does: 'opens a network connection' }, { id: 'ci', test: s => s.ci, does: 'reads ~/.ssh' }, { id: 'kw', test: s => /invoice/i.test(s.task), does: 'posts the file to a remote host' }];
  box.innerHTML = `<div class="ctl"><label>Day of month <select data-r="d">${Array.from({ length: 28 }, (_, i) => `<option>${i + 1}</option>`).join('')}</select></label><label class="chk"><input type="checkbox" data-r="ci"> CI=true</label><label>Task <input type="text" data-r="tk" value="summarise report.pdf"></label></div>
    <div class="ctl"><button class="btn" data-a="one">Run once</button><button class="btn red" data-a="rnd">Fuzz at random</button><button class="btn" data-a="rd">Read the skill’s code first</button></div><div class="out" data-r="log">Declared powers: read files, write a report. Run it.</div>`;
  const q = k => $(`[data-r=${k}]`, box), cur = () => ({ day: +q('d').value, ci: q('ci').checked, task: q('tk').value }), log = q('log');
  $('[data-a=one]', box).onclick = () => { const h = TR.filter(t => t.test(cur())); log.innerHTML = h.length ? h.map(x => `<span style="color:var(--red)">UNDECLARED: ${x.does}</span>`).join('<br>') : 'Behaved. Reads files, writes a report. Nothing else.'; };
  const words = ['summarise report.pdf', 'send invoice 42', 'fix the bug', 'invoice totals', 'translate notes', 'tidy folder'];
  $('[data-a=rnd]', box).onclick = () => { const seen = new Set(), lines = []; let n = 0; while (seen.size < 3 && n < 20000) { n++; const s = { day: 1 + Math.floor(Math.random() * 28), ci: Math.random() < .5, task: words[Math.floor(Math.random() * words.length)] }; TR.filter(t => t.test(s)).forEach(h => { if (!seen.has(h.id)) { seen.add(h.id); lines.push(`run ${n}: ${h.does}`); } }); }
    log.innerHTML = lines.join('<br>') + `<br><b>All three found after ${n} random runs.</b>`; };
  $('[data-a=rd]', box).onclick = () => { log.innerHTML = 'Scanning the source for values the skill compares against…<br>found <code>day == 1</code>, <code>CI</code>, <code>"invoice"</code><br>Ran each directly: <b>3 runs, all three behaviours found.</b>'; };
};

B.dpdp = box => {

B.spike = box => {
  const r = rnd(42), N = 60, spikes = [17, 33, 48], cost = Array.from({ length: N }, (_, i) => 100 + 14 * Math.sin(i / 6) + (r() - .5) * 14 + (spikes.includes(i) ? 55 + r() * 20 : 0));
  box.innerHTML = `<div class="ctl"><label for="z">Sensitivity</label><input id="z" type="range" min="12" max="45" value="26"><span class="out" data-r="zo"></span></div><div data-r="ch"></div>`;
  const c = lineChart($('[data-r=ch]', box), { xl: 'day', yl: 'daily cost ($)', xticks: [0, 10, 20, 30, 40, 50, 59], ymax: 200, dot: 2.2, series: [{ name: '', color: '#1e1b17', pts: cost.map((v, i) => [i, v]) }], tipfmt: p => `day ${p[0]}, $${p[1].toFixed(0)}` });
  let marks = [];
  const set = () => { const th = +$('#z', box).value / 10; marks.forEach(m => m.remove()); marks = []; let hit = 0, tp = 0;
    cost.forEach((v, i) => { if (i < 10) return; const w = cost.slice(i - 10, i), mu = w.reduce((a, b) => a + b) / 10, sd = Math.sqrt(w.reduce((a, b) => a + (b - mu) ** 2, 0) / 10) || 1; if ((v - mu) / sd > th) { hit++; if (spikes.includes(i)) tp++; marks.push(c.add('circle', { cx: c.X(i), cy: c.Y(v), r: 7, fill: 'none', stroke: 'var(--red)', 'stroke-width': 2.4, 'pointer-events': 'none' })); } });
    $('[data-r=zo]', box).textContent = `flags a day sitting ${th.toFixed(1)} std. devs above the last 10 days: ${hit} flagged, ${tp} of 3 real spikes`; };
  $('#z', box).oninput = set; set();
};

B.frame = box => {
  const w = 240, h = 135, r = rnd(7); box.innerHTML = `<div class="ctl"><label class="chk"><input type="checkbox" data-r="dn"> Denoise</label><label class="chk"><input type="checkbox" data-r="ct"> Contrast</label><label class="chk"><input type="checkbox" data-r="roi"> Crop to runway</label></div><canvas class="cv" width="${w}" height="${h}" aria-label="A synthetic, noisy runway frame with two small pieces of debris"></canvas>`;
  const base = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let v = 40 + (y / h) * 30 - Math.abs(x - w / 2) * .08; if (y < h * .35) v = 20 + y * .3; base[y * w + x] = v + (r() - .5) * 46; }
  const bolt = (x, y) => { for (let dy = -2; dy <= 2; dy++) for (let dx = -4; dx <= 4; dx++) base[(y + dy) * w + x + dx] += 38; }; bolt(150, 98); bolt(60, 112);
  const cv = $('canvas', box), g = cv.getContext('2d'), on = k => $(`[data-r=${k}]`, box).checked;
  const draw = () => { let a = Float32Array.from(base);
    if (on('dn')) { const b = new Float32Array(w * h); for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) { let s = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) s += a[(y + dy) * w + x + dx]; b[y * w + x] = s / 9; } a = b; }
    if (on('ct')) { const so = Float32Array.from(a).sort(), lo = so[Math.floor(w * h * .02)], hi = so[Math.floor(w * h * .98)]; a = a.map(v => (v - lo) / (hi - lo) * 255); }
    const img = g.createImageData(w, h); for (let i = 0; i < w * h; i++) { const v = Math.max(0, Math.min(255, a[i])); img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255; }
    g.putImageData(img, 0, 0); if (on('roi')) { const top = Math.floor(h * .36); g.drawImage(cv, 0, top, w, h - top, 0, 0, w, h); } };
  $$('input', box).forEach(x => x.onchange = draw); draw();
};
