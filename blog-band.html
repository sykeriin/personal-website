<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grass Files, Band Room</title>
<meta name="description" content="Grass Files: Durva Sharma's notes on builds, security, shoots and poems, kept as tapes you can put in a boombox.">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Pixelify+Sans:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--wall:#e7e7e3;--floor:#d3d3ce;--ink:#0b0b0c;--red:#e0122d;--silver:#b9b9b5;--paper:#f4f2ec;--sans:Archivo,Arial,sans-serif;--px:"Pixelify Sans",Archivo,sans-serif;--dw:min(36rem,42vw)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--wall)}
body{background:var(--wall);color:var(--ink);font-family:var(--sans);overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.bar{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:baseline;gap:1.5rem;padding:1.1rem clamp(1rem,2.4vw,2rem);pointer-events:none}
.bar a{pointer-events:auto;font-weight:600;font-size:.95rem;text-decoration:none;border-bottom:2px solid currentColor}
.bar a:hover{color:var(--red)}
.intro{position:absolute;z-index:40;left:clamp(1rem,2.4vw,2rem);top:3.3rem;font-size:1rem;line-height:1.4;font-weight:500;max-width:24rem}

/* the room */
.stage{position:relative;height:100svh;min-height:560px;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:6}
.word{position:absolute;z-index:3;font-weight:900;font-stretch:112%;text-transform:uppercase;letter-spacing:-.06em;line-height:.82;color:var(--red);pointer-events:none}
.me{position:absolute;z-index:4;transform-origin:50% 100%}
.me img{display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.me button{position:absolute;inset:8% 24% 0}
.me::after{content:'';position:absolute;left:12%;right:12%;bottom:-1%;height:5%;background:rgba(11,11,12,.2);border-radius:50%;z-index:-1}
.me.hop img{animation:hop .4s cubic-bezier(.3,.7,.3,1)}
.me.strum img{animation:strum .32s ease-in-out infinite}
.me.dance img{animation:dance .62s ease-in-out infinite}
@keyframes hop{40%{transform:translateY(-6%)}75%{transform:translateY(0) scaleY(.96)}}
@keyframes strum{50%{transform:translateY(1.5%) rotate(-1deg)}}
@keyframes dance{25%{transform:translateY(-4%) rotate(-3deg)}75%{transform:translateY(-4%) rotate(3deg)}}
.bubble{position:absolute;z-index:30;width:max-content;max-width:16rem;background:#fff;color:var(--ink);border-radius:12px;padding:.6rem .85rem;font-weight:600;font-size:.95rem;line-height:1.35;box-shadow:0 1px 0 rgba(11,11,12,.08),0 8px 24px rgba(11,11,12,.16);pointer-events:none}
.bubble::after{content:"";position:absolute;left:22px;bottom:-6px;width:12px;height:12px;background:#fff;transform:rotate(45deg);border-radius:0 0 3px 0}
.bubble.pop{animation:pop .25s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.spot{position:absolute;z-index:7;border-radius:12px}
.spot:focus-visible{outline:3px dashed var(--red);outline-offset:-4px}

/* tapes on the shelf */
.rack{position:absolute;z-index:9;display:flex;align-items:flex-end;gap:1.4%}
.tape{position:relative;flex:0 0 18.6%;min-width:0;aspect-ratio:1.58;background:var(--ink);border-radius:7%/11%;color:var(--ink);display:block;transform:rotate(var(--r,0deg));transition:transform .25s cubic-bezier(.3,1.3,.5,1);text-align:left}
.tape .lbl{position:absolute;left:7%;right:7%;top:9%;height:44%;background:var(--paper);border-radius:3px;padding:0 6% 4%;overflow:hidden;display:flex;align-items:flex-end}
.tape .lbl::before{content:"";position:absolute;left:0;right:0;top:0;height:26%;background:var(--red)}
.tape .lbl b{position:relative;display:block;font-weight:800;font-stretch:80%;font-size:var(--tf,.72rem);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tape .win{position:absolute;left:24%;right:24%;bottom:14%;height:24%;background:#3a3a3f;border-radius:99px;display:flex;justify-content:space-between;align-items:center;padding:0 8%}
.tape .win i{width:26%;aspect-ratio:1;border-radius:50%;background:var(--paper);border:2px dotted var(--ink)}
.tape.soon .lbl{background:#d8d8d3}
.tape.soon .lbl::before{background:#9b9b97}
.tape.soon .lbl b{color:#6d6d69}
.tape:hover,.tape:focus-visible{transform:translateY(-14%) rotate(0deg) scale(1.08)}
.tape.gone{visibility:hidden}
.tape.shake{animation:shake .4s}
@keyframes shake{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.flyer{position:fixed;z-index:70;pointer-events:none;margin:0}

/* the reading card */
.deck{position:fixed;z-index:60;top:0;right:0;bottom:0;width:var(--dw);background:var(--paper);transform:translateX(102%);transition:transform .55s cubic-bezier(.6,0,.2,1);overflow-y:auto;display:grid;grid-template-columns:2.6rem 1fr}
.deck.open{transform:none}
.spine{background:var(--red);color:var(--paper);writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:space-between;padding:1.2rem 0;font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.02em;font-size:.95rem}
.jc{padding:clamp(1.4rem,3vw,2.4rem)}
.jc .reels{display:flex;gap:1.2rem;align-items:center;background:var(--ink);border-radius:12px;padding:.8rem 1.2rem;width:max-content;margin-bottom:1.8rem}
.jc .reels svg{width:2.8rem;height:2.8rem;animation:spin 2.4s linear infinite}
.jc .reels span{color:var(--paper);font-weight:600;font-size:.9rem}
@keyframes spin{to{transform:rotate(360deg)}}
.jc h2{font-weight:900;font-stretch:88%;font-size:clamp(2rem,3.6vw,3.2rem);line-height:.98;letter-spacing:-.035em}
.jc .meta{margin:.9rem 0 1.6rem;font-weight:600;color:var(--red)}
.jc .body p{font-size:1.1rem;line-height:1.6;max-width:34rem;margin-bottom:1em}
.jc .body p:first-child{font-weight:700;font-size:1.25rem;line-height:1.4}
.jc .ctl{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:2rem}
.jc .ctl button,.jc .ctl a{background:var(--ink);color:var(--paper);padding:.7rem 1.2rem;font-weight:700;text-decoration:none;transition:background .2s}
.jc .ctl button:hover,.jc .ctl a:hover{background:var(--red)}
.foot{position:absolute;z-index:40;right:clamp(1rem,2.4vw,2rem);bottom:1rem;font-weight:600;font-size:.9rem;color:#5b5b57}

@media (max-width:760px){
  .chips{display:flex;gap:.6rem;padding:1rem 1rem 0}.chips button{flex:1;background:var(--ink);color:var(--paper);padding:.8rem 0;font-weight:700;font-size:1rem}.chips button:active{background:var(--red)}
  .stage{height:auto;min-height:0}
  .intro{position:static;padding:4rem 1rem 0;font-size:1rem;max-width:none}
  .rack{position:static;display:grid;justify-content:stretch;grid-template-columns:1fr 1fr;gap:1.6rem 1rem;padding:1rem 1rem 3rem}
  .tape{--tf:.95rem;width:100%}
  .tape .cap{display:block;position:absolute;top:104%;left:0;right:0;font-weight:700;font-size:.85rem;line-height:1.2}
  .rack .tape{margin-bottom:2.2rem}
  .tapes-h{display:block;padding:1.4rem 1rem 0;font-weight:900;font-stretch:88%;font-size:1.8rem;letter-spacing:-.03em}
  .deck{width:100%;grid-template-columns:2rem 1fr}
  .bubble{font-size:.84rem;max-width:11rem}
  .foot{position:static;display:block;padding:0 1rem 2rem}
}
@media (min-width:761px){.chips{display:none}.tapes-h{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.tape .cap{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="bar"><a href="/">← Back to the record</a><a href="/blog.html">Quiet version</a></nav>
<p class="intro">Notes on builds, security, shoots and poems. Put a tape in the boombox, or hit the drums.</p>

<section class="stage" id="stage" aria-label="Band room">
  <canvas id="back" aria-hidden="true"></canvas>
  <div class="word" id="word">Grass<br>Files</div>
  <div class="me" id="me"><img id="sprite" src="/char/durva-idle.png" alt="Durva, drawn as a pixel character"><button id="poke" aria-label="Poke Durva"></button></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <button class="spot" id="ampBtn" aria-label="The amp: turn it up"></button>
  <button class="spot" id="boomBtn" aria-label="The boombox: click to play or stop"></button>
  <button class="spot" id="guitarBtn" aria-label="Play the guitar"></button>
  <button class="spot" id="danceBtn" aria-label="Dance"></button>
  <button class="spot" id="drumBtn" aria-label="Play the drums"></button>
  <div class="bubble" id="bubble" aria-live="polite"></div>
</section>
<div class="chips" id="chips"><button data-go="guitar">Guitar</button><button data-go="drum">Drums</button><button data-go="dance">Dance</button></div>
<h2 class="tapes-h" id="tapesH">Tapes</h2>
<div class="rack" id="rack" aria-labelledby="tapesH"></div>
<p class="foot" id="foot"></p>

<aside class="deck" id="deck" aria-label="Now playing" aria-hidden="true">
  <div class="spine" id="spine"></div>
  <div class="jc" id="jc"></div>
</aside>

<script>
(() => {
const $ = id => document.getElementById(id), esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches, sleep = ms => new Promise(r => setTimeout(r, ms));
const INK = '#0b0b0c', RED = '#e0122d', SILVER = '#b9b9b5', PAPER = '#f4f2ec', WALL = '#e7e7e3', FLOOR = '#d3d3ce', DARK = '#26262a';
const SPR = p => `/char/durva-${p}.png`;

/* the tapes: `say` is what Durva says when he picks one up */
const POSTS = [
  { slug: 'intentionally-unfinished', short: 'Unfinished', title: 'This space intentionally unfinished', tag: 'Note', date: '31 Aug 2026', say: 'The first one. It’s short, I promise.',
    body: ['First note. This is where the longer things go.', 'Build logs, shoot write-ups, poems that didn’t fit anywhere else, and whatever doesn’t fit on a card. More soon.'] },
  { slug: 'tread', short: 'tread', title: 'Skipping prefill: notes on tread', tag: 'Build log', soon: true, say: 'The one where my own benchmark lied to me. Not recorded yet.' },
  { slug: 'taintmem', short: 'TaintMem', title: 'Planting a payload in agent memory', tag: 'Security', soon: true, say: 'How to make an AI agent remember the wrong thing. Not recorded yet.' },
  { slug: 'skillfuzz', short: 'SkillFuzz', title: 'Fuzzing the tools agents trust', tag: 'Security', soon: true, say: 'Running sketchy plugins ninety times so you don’t have to. Soon.' },
  { slug: 'runway', short: 'Runway', title: 'Clean frames from three runway cameras', tag: 'Vision', soon: true, say: 'Three cameras, one runway, a lot of noise. Soon.' }
];
const HELLO = 'Hi. Put a tape in the boombox, grab the guitar, hit the drums, or dance.';
const POKES = [['wave', 'Hey.'], ['point', 'The tapes are on the shelf. Up there.'], ['walk', 'I also shoot, direct and write poems. It’s a lot.'], ['wave', 'Poke me again. I dare you.']];
['idle', 'point', 'guitar', 'walk', 'sit', 'wave', 'headphones', 'guard', 'drums', 'drums2'].forEach(p => { const im = new Image(); im.src = SPR(p); });
const live = POSTS.filter(p => !p.soon);
$('foot').textContent = `${live.length} tape recorded, ${POSTS.length - live.length} still blank.`;

/* ---------- the room: 1600 x 860 units, scaled to the screen ---------- */
const back = $('back'), fx = $('fx'), bg = back.getContext('2d'), fg = fx.getContext('2d');
let focus = 690; let W = 0, H = 0, dpr = 1, phone = false, state = 'idle', playing = false, guitarOut = false, reading = null;
const cam = { s: 1, ox: 0, oy: 0 }, WORLD = 1600, WH = 860;
const L = { floor: 690, shelf: { x0: 24, x1: 540, y: 318 }, crate: { x: 70, y: 580, w: 290, h: 110 }, box: { x: 40, y: 430, w: 350, h: 150 }, deckC: [215, 492],
  amp: { x: 420, y: 505, w: 180, h: 185 }, guitar: 668, drum: 1290, word: { x: 36, y: 120, h: 150 },
  me: { idle: 885, guitar: 850, dance: 885, read: 885, drum: 1295 }, meH: 470, meB: 702, dance: { x: 775, y: 650 } };

/* clean vector drawing: soft gradients, thin dark outlines, no wobble */
const TAU = Math.PI * 2, LINE = '#0b0b0c';
const lg = (g, x0, y0, x1, y1, stops) => { const o = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([p, c]) => o.addColorStop(p, c)); return o; };
const rg = (g, x, y, r0, r1, stops, x1 = x, y1 = y) => { const o = g.createRadialGradient(x, y, r0, x1, y1, r1); stops.forEach(([p, c]) => o.addColorStop(p, c)); return o; };
const rrect = (g, x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
const paint = (g, fillStyle, w = 1.6, stroke = LINE) => { if (fillStyle) { g.fillStyle = fillStyle; g.fill(); } if (w) { g.lineWidth = w; g.strokeStyle = stroke; g.lineJoin = 'round'; g.stroke(); } };
const oval = (g, x, y, rx, ry, rot = 0) => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); };
const line = (g, pts, w = 1.6, col = LINE) => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.lineWidth = w; g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(); };
const CHROME = (g, x0, y0, x1, y1) => lg(g, x0, y0, x1, y1, [[0, '#f4f4f1'], [.45, '#b9b9b5'], [.55, '#8d8d89'], [1, '#d8d8d4']]);
const shadow = (g, cx, w, a = .22) => { g.fillStyle = `rgba(11,11,12,${a})`; oval(g, cx, L.floor + 12, w, 11); g.fill(); };
const hatch = (g, x, y, w, h, step, col, ang = 1) => { g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.strokeStyle = col; g.lineWidth = 1; for (let k = -h; k < w + h; k += step) { g.beginPath(); g.moveTo(x + k, y + (ang > 0 ? h : 0)); g.lineTo(x + k + h * ang, y + (ang > 0 ? 0 : h)); g.stroke(); } g.restore(); };

function camTransform(g) { g.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * cam.ox, dpr * cam.oy); }

/* the still room: wall, floor, window light, shelf, crate, stand, rug, floor tiles */
function drawBack() {
  const g = bg; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = WALL; g.fillRect(0, 0, W, H); camTransform(g);
  const x0 = -cam.ox / cam.s - 10, x1 = (W - cam.ox) / cam.s + 10, yB = (H - cam.oy) / cam.s + 10, FL = L.floor;
  g.fillStyle = lg(g, 0, -300, 0, FL, [[0, '#f3f3f0'], [1, '#dededa']]); g.fillRect(x0, -400, x1 - x0, FL + 400);
  /* wall panels, rail, baseboard */
  g.fillStyle = '#d6d6d1'; g.fillRect(x0, 540, x1 - x0, FL - 540); line(g, [[x0, 540], [x1, 540]], 2); line(g, [[x0, 547], [x1, 547]], 1, 'rgba(11,11,12,.18)');
  for (let x = Math.floor(x0 / 160) * 160; x < x1; x += 160) { rrect(g, x + 14, 562, 132, 92, 3); paint(g, null, 1, 'rgba(11,11,12,.16)'); }
  g.fillStyle = '#c4c4bf'; g.fillRect(x0, 664, x1 - x0, 26); line(g, [[x0, 664], [x1, 664]], 1.4); line(g, [[x0, FL], [x1, FL]], 2.4);
  /* floor */
  g.fillStyle = lg(g, 0, FL, 0, yB, [[0, '#b8b8b3'], [.35, '#cfcfca'], [1, '#dcdcd7']]); g.fillRect(x0, FL, x1 - x0, yB - FL);
  const rows = [FL, 724, 762, 810, yB]; rows.forEach((y, r) => { if (r) line(g, [[x0, y], [x1, y]], 1, 'rgba(11,11,12,.2)'); });
  for (let r = 0; r < 4; r++) for (let x = Math.floor(x0 / 170) * 170 + (r * 61) % 170; x < x1; x += 170) line(g, [[x, rows[r]], [x - 7 * (r + 1), rows[r + 1]]], 1, 'rgba(11,11,12,.15)');
  /* window and the light it throws */
  const wx = 1010, wy = 80, ww = 240, wh = 290;
  g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.moveTo(wx + 10, wy + wh); g.lineTo(wx + ww - 10, wy + wh); g.lineTo(wx + ww - 380, 800); g.lineTo(wx - 400, 800); g.closePath(); g.fill();
  rrect(g, wx - 10, wy - 10, ww + 20, wh + 20, 3); paint(g, '#cfcfca', 1.6); g.fillStyle = lg(g, wx, wy, wx + ww, wy + wh, [[0, '#ffffff'], [1, '#e9eef0']]); g.fillRect(wx, wy, ww, wh); line(g, [[wx + ww / 2, wy], [wx + ww / 2, wy + wh]], 5, '#cfcfca'); line(g, [[wx, wy + wh * .5], [wx + ww, wy + wh * .5]], 5, '#cfcfca'); rrect(g, wx, wy, ww, wh, 0); paint(g, null, 2); rrect(g, wx - 16, wy + wh + 10, ww + 32, 12, 2); paint(g, '#c4c4bf', 1.4);
  /* framed spider lily */
  g.fillStyle = 'rgba(11,11,12,.12)'; g.fillRect(566, 104, 124, 156); rrect(g, 560, 96, 124, 156, 3); paint(g, '#f4f2ec', 2.4); rrect(g, 574, 110, 96, 128, 1); paint(g, '#ebe8e0', 1, 'rgba(11,11,12,.3)');
  line(g, [[622, 226], [622, 168]], 2, '#4b4b48'); for (let k = -3; k <= 3; k++) { g.beginPath(); g.moveTo(622, 168); g.quadraticCurveTo(622 + k * 15, 120, 622 + k * 24, 138 + Math.abs(k) * 5); g.lineWidth = 2.2; g.strokeStyle = RED; g.lineCap = 'round'; g.stroke(); }
  /* shadows on the floor */
  shadow(g, L.crate.x + L.crate.w / 2, 190); shadow(g, L.amp.x + L.amp.w / 2, 110); shadow(g, L.guitar, 74); shadow(g, L.drum + 40, 330); shadow(g, L.me.idle, 150, .16);
  /* shelf */
  if (!phone) { const { x0: a, x1: b, y } = L.shelf; rrect(g, a, y, b - a, 14, 2); paint(g, lg(g, 0, y, 0, y + 14, [[0, '#a9a9a4'], [1, '#85857f']]), 1.8); for (const bx of [a + 46, b - 46]) { line(g, [[bx, y + 14], [bx, y + 54]], 3, '#5d5d59'); line(g, [[bx, y + 54], [bx - 32, y + 14]], 3, '#5d5d59'); } }
  /* crate under the boombox */
  const c = L.crate; g.fillStyle = lg(g, c.x, c.y, c.x + c.w, c.y, [[0, '#a8a8a3'], [1, '#8d8d88']]); g.fillRect(c.x, c.y, c.w, c.h); for (let k = 1; k < 4; k++) line(g, [[c.x, c.y + k * c.h / 4], [c.x + c.w, c.y + k * c.h / 4]], 1.4, 'rgba(11,11,12,.4)'); for (const px of [c.x + 6, c.x + c.w - 14]) { g.fillStyle = 'rgba(11,11,12,.25)'; g.fillRect(px, c.y, 8, c.h); } rrect(g, c.x, c.y, c.w, c.h, 2); paint(g, null, 2);
  /* rug and floor tiles */
  const rx = L.me.idle; oval(g, rx, 708, 250, 30); paint(g, lg(g, 0, 680, 0, 740, [[0, '#ef2a43'], [1, '#b50e24']]), 2); oval(g, rx, 708, 214, 22); paint(g, null, 1.2, 'rgba(244,242,236,.7)');
  for (let k = -9; k <= 9; k++) line(g, [[rx + k * 25, 735], [rx + k * 25 + 2, 742]], 1.2, 'rgba(11,11,12,.55)');
  const d = L.dance; for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) { const tx = d.x + i * 50, ty = d.y + 18 + j * 26; g.beginPath(); g.moveTo(tx + 12, ty); g.lineTo(tx + 58, ty); g.lineTo(tx + 46, ty + 24); g.lineTo(tx, ty + 24); g.closePath(); paint(g, (i + j) % 2 ? '#f4f2ec' : '#c3c3be', 1.2); }
  /* drum throne, behind Durva when he plays */
  const tx2 = L.me.drum; line(g, [[tx2, 640], [tx2, 684]], 5, '#4b4b48'); line(g, [[tx2 - 40, 690], [tx2, 668], [tx2 + 40, 690]], 3, '#4b4b48'); oval(g, tx2, 632, 52, 14); paint(g, lg(g, tx2 - 52, 0, tx2 + 52, 0, [[0, '#232327'], [.5, '#47474d'], [1, '#232327']]), 1.8);
  /* guitar stand, and the guitar on it unless Durva is playing it */
  const gx = L.guitar; line(g, [[gx - 44, 690], [gx, 600], [gx + 44, 690]], 3, '#4b4b48'); line(g, [[gx - 20, 650], [gx + 20, 650]], 2.6, '#4b4b48');
  if (!guitarOut) {

const sprite = $('sprite'), me = $('me'), bubble = $('bubble'); let sayTimer = 0;
const setPose = p => { curPose = p; sprite.src = SPR(p); };
function say(text, pose, ms = 3200) { bubble.textContent = text; bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop'); bubble.style.opacity = 1; if (pose) setPose(pose); placeBubble(); clearTimeout(sayTimer); if (ms) sayTimer = setTimeout(() => { if (state === 'idle') { bubble.style.opacity = 0; setPose('idle'); } }, ms); }
let walk = 0; const moveMe = x => { cancelAnimationFrame(walk); const x0 = meX, t0 = performance.now(); if (reduce) { meX = x; placeAll(); return; } const step = now => { const u = Math.min(1, (now - t0) / 650), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; meX = x0 + (x - x0) * e; placeAll(); if (u < 1) walk = requestAnimationFrame(step); }; walk = requestAnimationFrame(step); };

/* ---------- the tapes ---------- */
const rack = $('rack'); let flyer = null;
rack.innerHTML = POSTS.map((p, i) => `<button class="tape${p.soon ? ' soon' : ''}" data-i="${i}" aria-label="${esc(p.title)}${p.soon ? ' (not recorded yet)' : ''}"><span class="lbl"><b>${esc(p.short)}</b></span><span class="win"><i></i><i></i></span><span class="cap">${esc(p.title)}</span></button>`).join('');
const tapes = [...rack.children];
const pan = x => { focus = x; if (phone) moveCam(target(false), reduce ? 0 : 600); };
$('chips').addEventListener('click', async e => { const go = e.target.dataset.go; if (!go || state !== 'idle') return; pan(go === 'drum' ? 1150 : go === 'guitar' ? 760 : 840); await sleep(phone && !reduce ? 650 : 0); $(go + 'Btn').click(); });
tapes.forEach((el, i) => { const p = POSTS[i];
  el.addEventListener('mouseenter', () => { if (state === 'idle' && !phone) say(p.say, 'point', 0); });
  el.addEventListener('mouseleave', () => { if (state === 'idle') { bubble.style.opacity = 0; setPose('idle'); } });
  el.addEventListener('click', () => p.soon ? soon(el, p) : playTape(el, p)); });
function soon(el, p) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); say(p.say, 'point', 3200); }

async function playTape(el, p) {
  if (state === 'reading') return; state = 'reading'; reading = { el, p }; guitarOut = false; discoOn = false;
  say(p.say, 'headphones', 0);
  const r = el.getBoundingClientRect(), [tx, ty] = P(L.deckC[0], L.deckC[1]), st = $('stage').getBoundingClientRect();
  if (!phone && !reduce) { /* the tape rides over to the boombox */
    const f = el.cloneNode(true); f.className = 'tape flyer'; Object.assign(f.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', margin: 0, transform: 'none' }); document.body.appendChild(f); flyer = f; el.classList.add('gone');
    const cx = st.left + tx - r.width * .3, cy = st.top + ty - r.height * .3;
    await Promise.race([sleep(1000), f.animate([{ transform: 'translate(0,0) rotate(0deg) scale(1)' }, { transform: `translate(${(cx - r.left) * .5}px,${(cy - r.top) * .5 - 70}px) rotate(-10deg) scale(1.1)`, offset: .5 }, { transform: `translate(${cx - r.left}px,${cy - r.top}px) rotate(0deg) scale(.6)` }], { duration: 750, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' }).finished.catch(() => {})]);
    f.remove(); flyer = null;
  } else el.classList.add('gone');
  inserted = true; playing = true; startLoop(); moveMe(L.me.read);
  moveCam(target(true), reduce ? 0 : 600); openDeck(p);
}
function openDeck(p) {
  const reel = '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#f4f2ec"/><circle cx="20" cy="20" r="7" fill="#0b0b0c"/>' + [0, 1, 2].map(k => `<rect x="18.4" y="1.6" width="3.2" height="9" fill="#0b0b0c" transform="rotate(${k * 120} 20 20)"/>`).join('') + '</svg>';
  $('spine').innerHTML = `<span>Grass Files</span><span>${esc(p.tag)}</span>`;
  $('jc').innerHTML = `<div class="reels">${reel}<span>Now playing</span>${reel}</div><h2>${esc(p.title)}</h2><p class="meta">${esc(p.date)} · ${esc(p.tag)}</p><div class="body">${p.body.map(t => `<p>${esc(t)}</p>`).join('')}</div><div class="ctl"><button id="eject" type="button">Eject the tape</button><a href="/blog.html">Quiet version</a></div>`;
  const d = $('deck'); d.classList.add('open'); d.setAttribute('aria-hidden', 'false'); d.scrollTop = 0; history.replaceState(null, '', '#/' + p.slug); $('eject').onclick = closeDeck; setTimeout(() => $('eject').focus({ preventScroll: true }), 600);
}
async function closeDeck() {
  if (state !== 'reading') return; const d = $('deck'); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); history.replaceState(null, '', location.pathname);
  const r = reading; reading = null; state = 'idle'; inserted = false; playing = false; moveCam(target(false), reduce ? 0 : 600); moveMe(L.me.idle); say('Back on the shelf.', 'wave', 1800);
  if (r) { r.el.classList.remove('gone'); r.el.animate([{ transform: 'translateY(-60%) scale(1.1)' }, { transform: 'none' }], { duration: 400, easing: 'cubic-bezier(.3,1.4,.5,1)' }); }
  startLoop(true);
}
addEventListener('keydown', e => { if (e.key === 'Escape') closeDeck(); });

/* ---------- poke, guitar, dance, boombox ---------- */
let pk = 0;
$('poke').addEventListener('click', () => { if (state !== 'idle') return; const [pose, line] = POKES[pk++ % POKES.length]; me.classList.remove('hop'); void me.offsetWidth; me.classList.add('hop'); say(line, pose, 2800); });
$('guitarBtn').addEventListener('click', async () => {
  if (state !== 'idle') return; state = 'guitar'; guitarOut = true; drawBack(); $('guitarBtn').hidden = true; moveMe(L.me.guitar + 90); say('Okay. Listen.', 'guitar', 0); startLoop();
  await sleep(reduce ? 0 : 700); me.classList.add('strum'); playing = true; await sleep(reduce ? 0 : 5200); me.classList.remove('strum');
  guitarOut = false; playing = false; state = 'idle'; drawBack(); placeAll(); moveMe(L.me.idle); pan(690); say('That’s the one I know.', 'wave', 2600); startLoop(true);
});
const PIECES = ['snare', 'hat', 'kick', 'tom', 'crash', 'floor', 'snare', 'ride'];
$('drumBtn').addEventListener('click', async () => {
  if (state !== 'idle') return; state = 'drums'; moveMe(L.me.drum); say('Okay. One fill.', 'sit', 0); startLoop(); await sleep(reduce ? 0 : 600);
  for (let n = 0; n < (reduce ? 0 : 16); n++) { setPose(n % 2 ? 'drums2' : 'drums'); if (n % 2) { hit[PIECES[(n >> 1) % PIECES.length]] = 1; if (n % 4 === 1) hit.kick = 1; } await sleep(240); }
  setPose('drums'); await sleep(reduce ? 0 : 500); state = 'idle'; moveMe(L.me.idle); pan(690); say('Right. The tapes.', 'point', 2400); startLoop(true);
});
$('danceBtn').addEventListener('click', async () => {
  if (state !== 'idle') return; state = 'dance'; moveMe(L.me.dance); say('Okay. One song.', 'wave', 0); playing = true; discoOn = true; startLoop(); await sleep(reduce ? 0 : 500); me.classList.add('dance');
  const poses = ['wave', 'walk', 'point', 'headphones', 'wave', 'guard']; for (let n = 0; n < (reduce ? 0 : 20); n++) { setPose(poses[n % poses.length]); await sleep(300); }
  me.classList.remove('dance'); playing = false; discoOn = false; state = 'idle'; moveMe(L.me.idle); pan(690); say('Okay, that’s enough.', 'idle', 2400); startLoop(true);
});
$('ampBtn').addEventListener('click', () => { if (state !== 'idle') return; playing = !playing; say(playing ? 'Turned up. Hum only, sorry.' : 'Turned it down.', 'point', 2400); startLoop(!playing); });
$('boomBtn').addEventListener('click', () => { if (state !== 'idle') return; playing = !playing; say(playing ? 'Nothing in it yet. Pick a tape.' : 'Off.', 'point', 2400); startLoop(!playing); });

/* ---------- the animation loop: runs only while something moves ---------- */
let loop = 0, last = false;
function startLoop(once) { cancelAnimationFrame(loop); if (reduce) { drawFx(5); return; } last = !!once; const t0 = performance.now(); const fr = now => { drawFx(now / 1000); if (state !== 'idle' || playing || discoOn || (last && now - t0 < 800)) loop = requestAnimationFrame(fr); else drawFx(now / 1000); }; loop = requestAnimationFrame(fr); }

/* ---------- boot ---------- */
function boot() { Object.assign(cam, target(state === 'reading')); layout(); }
let lastW = 0, lastH = 0; new ResizeObserver(() => { const st = $('stage'); if (st.clientWidth === lastW && st.clientHeight === lastH) return; lastW = st.clientWidth; lastH = st.clientHeight; boot(); }).observe($('stage')); addEventListener('resize', boot); boot();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { layout(); });
sprite.addEventListener('load', () => placeAll());
setTimeout(() => say(HELLO, 'wave', 4200), 500); startLoop(true);
const hash = location.hash.replace(/^#\/?/, ''); if (hash) { const i = POSTS.findIndex(p => p.slug === hash && !p.soon); if (i >= 0) setTimeout(() => playTape(tapes[i], POSTS[i]), 900); }
})();
</script>
